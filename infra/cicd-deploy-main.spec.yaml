apiVersion: workflow/v1
kind: GitHubActionsWorkflow
metadata:
  name: deploy-main
  description: CI/CD pipeline to build and deploy action-spec on merge to main
spec:
  trigger:
    push:
      branches:
        - main

  permissions:
    contents: read
    id-token: write  # Required for AWS OIDC authentication

  jobs:
    build-and-deploy:
      name: Build and Deploy to AWS App Runner
      runs-on: ubuntu-latest

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v4
          with:
            role-to-assume: arn:aws:iam::252374924199:role/github-actions-deploy-role
            aws-region: us-east-2

        - name: Login to Amazon ECR
          id: login-ecr
          uses: aws-actions/amazon-ecr-login@v2

        - name: Extract version from package.json
          id: version
          run: |
            VERSION=$(jq -r '.version' package.json)
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "Building version: $VERSION"

        - name: Build Docker image
          env:
            ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
            ECR_REPOSITORY: action-spec
            IMAGE_TAG: ${{ steps.version.outputs.version }}
          run: |
            docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
            docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest

        - name: Push to Amazon ECR
          env:
            ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
            ECR_REPOSITORY: action-spec
            IMAGE_TAG: ${{ steps.version.outputs.version }}
          run: |
            docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
            docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

        - name: Trigger App Runner deployment
          env:
            SERVICE_ARN: arn:aws:apprunner:us-east-2:252374924199:service/action-spec/c0e612943e1e4a81a04919d1f9cde35e
          run: |
            aws apprunner start-deployment \
              --service-arn $SERVICE_ARN \
              --region us-east-2

        - name: Wait for deployment to complete
          env:
            SERVICE_ARN: arn:aws:apprunner:us-east-2:252374924199:service/action-spec/c0e612943e1e4a81a04919d1f9cde35e
          run: |
            echo "Waiting for deployment to complete..."
            for i in {1..30}; do
              STATUS=$(aws apprunner describe-service \
                --service-arn $SERVICE_ARN \
                --region us-east-2 \
                --query 'Service.Status' \
                --output text)

              if [ "$STATUS" = "RUNNING" ]; then
                echo "✅ Deployment complete! Service is RUNNING"
                exit 0
              elif [ "$STATUS" = "OPERATION_IN_PROGRESS" ]; then
                echo "⏳ Deployment in progress... ($i/30)"
                sleep 20
              else
                echo "❌ Unexpected status: $STATUS"
                exit 1
              fi
            done

            echo "⏱️ Deployment timeout after 10 minutes"
            exit 1

        - name: Verify deployment
          env:
            SERVICE_URL: https://action-spec.aws.trakrf.id
          run: |
            echo "Testing service at $SERVICE_URL"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" $SERVICE_URL)

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Service is healthy (HTTP $HTTP_CODE)"
            else
              echo "❌ Service returned HTTP $HTTP_CODE"
              exit 1
            fi

  environments:
    production:
      url: https://action-spec.aws.trakrf.id
      variables:
        AWS_REGION: us-east-2
        ECR_REPOSITORY: action-spec
        APP_RUNNER_SERVICE_ARN: arn:aws:apprunner:us-east-2:252374924199:service/action-spec/c0e612943e1e4a81a04919d1f9cde35e

  required_secrets:
    # Configured in GitHub repository settings
    - name: AWS_ROLE_ARN
      description: IAM role ARN for GitHub Actions OIDC authentication
      example: arn:aws:iam::252374924199:role/github-actions-deploy-role

  required_repository_variables:
    - name: AWS_REGION
      value: us-east-2
    - name: ECR_REPOSITORY
      value: action-spec
    - name: APP_RUNNER_SERVICE_ARN
      value: arn:aws:apprunner:us-east-2:252374924199:service/action-spec/c0e612943e1e4a81a04919d1f9cde35e

  prerequisites:
    aws_iam:
      - name: GitHub Actions OIDC provider
        description: Trust relationship for github.com OIDC provider
        oidc_provider: token.actions.githubusercontent.com

      - name: Deploy role
        description: IAM role with ECR push and App Runner deployment permissions
        role_name: github-actions-deploy-role
        policies:
          - AmazonEC2ContainerRegistryPowerUser
          - AppRunnerFullAccess
        trust_policy:
          effect: Allow
          principal:
            federated: arn:aws:iam::252374924199:oidc-provider/token.actions.githubusercontent.com
          condition:
            StringEquals:
              token.actions.githubusercontent.com:aud: sts.amazonaws.com
            StringLike:
              token.actions.githubusercontent.com:sub: "repo:trakrf/action-spec:ref:refs/heads/main"

  notifications:
    on_success:
      - type: github-commit-status
        context: deploy/production
        description: Deployed successfully to production

    on_failure:
      - type: github-commit-status
        context: deploy/production
        description: Deployment failed
      - type: github-issue
        labels:
          - deployment-failure
          - bug

  monitoring:
    deployment_time:
      warning_threshold: 5 minutes
      critical_threshold: 10 minutes

    success_rate:
      target: 95%
      window: 7 days
